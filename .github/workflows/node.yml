name: Node Basic Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  node:
    runs-on: wsl-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run application
        run: | 
          node app.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f node app.js
